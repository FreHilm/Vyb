# Release pipeline.
#
# Trigger: push a tag of the form v*.*.* (e.g. v1.0.0). Each runner
# builds its platform's installer, signs/notarizes where applicable,
# and uploads to the same draft GitHub Release via Forge's publisher.
#
# After all three jobs succeed, edit the draft release on GitHub
# (add release notes), then click "Publish release" to ship it.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# GITHUB_TOKEN defaults to read-only on repos created after Feb 2023.
# The GitHub publisher needs to create + edit releases (POST/PATCH
# /repos/.../releases) and upload assets, both of which require write
# access to the `contents` scope. Declared at the workflow level so all
# three matrix jobs inherit it.
permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Linux build deps
        if: matrix.os == 'ubuntu-latest'
        # rpmbuild = MakerRpm; fakeroot/dpkg = MakerDeb. The squirrel
        # maker needs mono on Linux, but we don't build Windows from
        # this runner so that's irrelevant.
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      # Forge's GitHub publisher uses package.json `version` (not the
      # git tag) to pick the target release. If we push v0.9.1 but
      # package.json still says 0.9.0, artifacts silently upload to a
      # v0.9.0 draft and the v0.9.1 draft stays empty. Fail fast here.
      # Linux only — platform-independent, no need to run 3×.
      - name: Verify package.json version matches tag
        if: matrix.os == 'ubuntu-latest'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match package.json version $PKG_VERSION."
            echo "Fix: bump package.json to $TAG (and run 'npm install' to sync the lockfile), commit, delete and re-create the tag on the new commit."
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json version $PKG_VERSION."

      # Fail fast with a clear, actionable message if package-lock.json
      # has drifted from package.json — otherwise `npm ci` rejects it
      # with a cryptic wall of usage text. Drift usually sneaks in after
      # a merge (the lockfile is a generated file that merges badly) or
      # a hand-edit of package.json without re-running `npm install`.
      # Linux only — it's platform-independent, no need to run 3×.
      - name: Verify package-lock.json is in sync
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp package-lock.json /tmp/lock.before
          npm install --package-lock-only --no-audit --no-fund >/dev/null 2>&1
          if ! diff -q /tmp/lock.before package-lock.json >/dev/null; then
            echo "::error::package-lock.json is out of sync with package.json."
            echo "Fix: run 'npm install' locally, commit the updated package-lock.json, and push."
            diff /tmp/lock.before package-lock.json | head -40 || true
            exit 1
          fi
          echo "package-lock.json is in sync."

      - name: Install
        run: npm ci

      # macOS signing identity import. The certificate is stored as a
      # base64-encoded p12 in repo secrets; we decode it into a
      # temporary keychain that's destroyed when the job finishes.
      - name: Import macOS signing certificate
        if: matrix.os == 'macos-latest'
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/vyb-cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/vyb-build.keychain-db
          echo -n "$MAC_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      # Diagnostic — prints which signing identities codesign can see
      # right after the import + what value our config will look for.
      # If the configured identity string doesn't match any line in the
      # find-identity output (extra whitespace, missing team ID, copied
      # with quotes, etc.) signing silently falls back to ad-hoc and
      # notarization rejects the whole bundle.
      - name: Verify signing identity
        if: matrix.os == 'macos-latest'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          echo "=== Identities visible to codesign ==="
          security find-identity -v -p codesigning
          echo
          echo "=== Configured APPLE_SIGNING_IDENTITY ==="
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "ERROR: APPLE_SIGNING_IDENTITY secret is empty — signing will fall back to ad-hoc."
            exit 1
          fi
          printf '%s\n' "$APPLE_SIGNING_IDENTITY"
          echo
          echo "=== Matching cert in keychain ==="
          if security find-identity -v -p codesigning | grep -F "$APPLE_SIGNING_IDENTITY"; then
            echo "OK: identity matches a keychain entry."
          else
            echo "ERROR: APPLE_SIGNING_IDENTITY does not match any identity above."
            echo "Most common mistake: the secret value includes the surrounding quotes from"
            echo "  security find-identity output. The value should be the bare string:"
            echo "  Developer ID Application: Your Name (TEAMID)"
            echo "with no leading/trailing quotes or whitespace."
            exit 1
          fi

      - name: Publish
        env:
          # Used by the GitHub publisher to push artifacts to a Release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS-only — the forge config gates signing on these being set.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # forge.config.ts passes this to osxSign as `keychain` so
          # codesign uses the temp keychain we imported the cert into.
          # Empty on non-macOS runners is harmless (signing block skipped).
          MAC_KEYCHAIN_PATH: ${{ runner.temp }}/vyb-build.keychain-db
        run: npm run publish
